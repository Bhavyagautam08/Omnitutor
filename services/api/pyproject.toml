[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitutor-api"
version = "0.1.0"
description = "Incremental Python backend foundation for OmniTutor"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "google-genai>=1,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "qdrant-client>=1.13,<2",
  "sqlalchemy[asyncio]>=2,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires the local PostgreSQL and Qdrant services"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
